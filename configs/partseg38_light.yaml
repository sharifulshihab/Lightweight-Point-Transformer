# Experiment configuration
# Model: PointTransformer-PartSeg38-Light

model:
  name: PointTransformer-PartSeg38-Light
  bottleneck_ratio: 2
  mid_ratio: 1
  cls_dim: 256

dataset:
  name: ShapeNetPart
  num_categories: 16
  num_parts: 50
  num_points: 2048
  input_channels: 6

training:
  epochs: 100
  loop: 2
  batch_size: 16
  optimizer: AdamW
  weight_decay: 0.02
  max_learning_rate: 0.001
  scheduler: OneCycleLR
  warmup_fraction: 0.05
  initial_learning_rate: 0.0001
  final_learning_rate: 0.0000001
  loss: CrossEntropyLoss
  mixed_precision: false
  gradient_clipping: false
  augmentation: false
  num_workers: 2
